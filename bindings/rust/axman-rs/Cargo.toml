[package]
name = "axman-rs"
version = "1.0.0"
edition = "2021"
authors = ["AXMA Team"]
description = "Safe, idiomatic Rust wrapper for AXMANet with zero-copy FFI and RAII"
license = "Apache-2.0"

[dependencies]
axman-sys = { path = "../axman-sys" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
rayon = "1.8"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="banner_bg_axman" cx="25%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#270a3c" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f071d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06020c" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="text_grad_n" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="flow_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow_axman" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#banner_bg_axman)"/>
  <rect width="1276" height="636" x="2" y="2" rx="34" stroke="#3b0764" stroke-width="2" fill="none"/>

  <!-- Left Icon Group (Scaled down to 440x440) -->
  <g transform="translate(260, 320) scale(0.55)">
    <!-- Hyperedge Shape -->
    <polygon points="-240,-320 -80,-360 260,-160 320,240 120,360 -260,180" 
      fill="#1e1035" stroke="url(#flow_grad)" stroke-width="6" opacity="0.6" filter="url(#glow_axman)"/>

    <!-- 'N' Glyph -->
    <path d="M-180,-260 L-130,-260 L-130,260 L-180,260 Z" fill="#38bdf8" filter="url(#glow_axman)"/>
    <path d="M-130,-260 L-60,-260 L130,260 L60,260 Z" fill="url(#flow_grad)" filter="url(#glow_axman)"/>
    <path d="M130,-260 L180,-260 L180,260 L130,260 Z" fill="#c084fc" filter="url(#glow_axman)"/>

    <!-- Ports -->
    <circle cx="-260" cy="-180" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="-260" cy="-180" r="12" fill="#38bdf8"/>
    <line x1="-234" y1="-180" x2="-180" y2="-180" stroke="#38bdf8" stroke-width="5"/>

    <circle cx="-260" cy="0" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="-260" cy="0" r="12" fill="#38bdf8"/>
    <line x1="-234" y1="0" x2="-180" y2="0" stroke="#38bdf8" stroke-width="5"/>

    <circle cx="-260" cy="180" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="-260" cy="180" r="12" fill="#38bdf8"/>
    <line x1="-234" y1="180" x2="-180" y2="180" stroke="#38bdf8" stroke-width="5"/>

    <!-- Target -->
    <circle cx="260" cy="0" r="34" fill="#0f172a" stroke="#ec4899" stroke-width="5" filter="url(#glow_axman)"/>
    <circle cx="260" cy="0" r="16" fill="#ec4899"/>
    <line x1="180" y1="0" x2="226" y2="0" stroke="#ec4899" stroke-width="5"/>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(520, 240)">
    <!-- Badge -->
    <rect x="0" y="0" width="260" height="32" rx="16" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="130" y="21" fill="#e9d5ff" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">NEURAL MODEL &amp; ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="105" fill="url(#text_grad_n)" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="4">AXMANet</text>

    <!-- Subtitle -->
    <text x="2" y="152" fill="#c084fc" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">CATEGORICAL HYPERGRAPH NEURAL ARCHITECTURE</text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 190)">
      <line x1="0" y1="0" x2="680" y2="0" stroke="#4c1d95" stroke-width="1.5"/>

      <g transform="translate(0, 25)">
        <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
        <text x="20" y="11" fill="#cbd5e1" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">Fused Port-Hypergraph Attention (FPHA)</text>

        <circle cx="360" cy="6" r="4" fill="#ec4899"/>
        <text x="374" y="11" fill="#cbd5e1" font-family="Segoe UI, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500">Zero-Copy C-ABI (&lt; 0.5 µs, C++/Rust/Py/Java)</text>
      </g>
    </g>
  </g>
</svg>